name: Build Neon Breach native apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-exe:
    name: Windows Tauri installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies and native scaffolds
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm native:setup -- --install
      - name: Build Windows installers
        shell: pwsh
        run: pnpm desktop:build
      - name: Upload EXE and MSI
        uses: actions/upload-artifact@v4
        with:
          name: neonbreach-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies and initialize Android
        run: |
          pnpm install --frozen-lockfile
          pnpm native:setup -- --install
          pnpm native:setup -- --android
      - name: Build debug APK
        run: pnpm android:build:debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neonbreach-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  server-check:
    name: Multiplayer server checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Test authoritative server
        run: |
          pnpm install --frozen-lockfile
          pnpm test:server
